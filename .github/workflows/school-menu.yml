name: School Menu Agent

on:
  schedule:
    - cron: '0 18 * * *'  # 6:00 PM UTC daily (7:00 PM UK time)
  workflow_dispatch:  # Allow manual triggers

jobs:
  menu-notification:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/s极up-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pdfplumber requests beautifulsoup4 python-dotenv
        
    - name: Run menu agent
      env:
        PDF_PATH: ./menu.pdf
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      run: |
        python school_menu_github.py
        
    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: menu-agent-results
        path: menu_agent.log
